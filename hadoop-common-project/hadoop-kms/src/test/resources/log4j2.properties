# STDOUT Appender
appender.console.name=stdout
appender.console.type=Console
appender.console.target=SYSTEM_OUT
appender.console.layout.type=PatternLayout
appender.console.layout.pattern=%d{ISO8601} %-5p %c{1} - %m%n

rootLogger=INFO, stdout
logger.conf.name=org.apache.hadoop.conf
logger.conf.level=ERROR
logger.kms-server.name=org.apache.hadoop.crytpo.key.kms.server
logger.kms-server.level=ALL
logger.grammar.name=org.glassfish.jersey.server.wadl.internal.generators.WadlGeneratorJAXBGrammarGenerator
logger.grammar.level=OFF
logger.security.name=org.apache.hadoop.security
logger.security.level=OFF
logger.directory.name=org.apache.directory.server.core
logger.directory.level=OFF
logger.native.name=org.apache.hadoop.util.NativeCodeLoader
logger.native.level=OFF
# make zookeeper log level an explicit config, and not changing with rootLogger.
logger.zookeeper.name=org.apache.zookeeper
logger.zookeeper.level=INFO
logger.curator.name=org.apache.curator
logger.curator.level=INFO
# make jetty log level an explicit config, and not changing with rootLogger.
logger.jetty.name=org.eclipse.jetty
logger.jetty.level=INFO